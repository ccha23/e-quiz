; See https://docs.moodle.org/402/en/PHP
; See /usr/local/etc/php/php.ini-production for detailed configurations

memory_limit = 512M
session.save_handler = files
file_uploads = On
session.auto_start = Off
max_execution_time = 600
date.timezone = Asia/Hong_Kong
upload_max_filesize = 128M
post_max_size = 128M
max_input_vars = 5000
display_errors = off
; cgi.fix_pathinfo = 0

; Set a User-Agent so PHP's stream functions (file_get_contents, etc.)
; don't get 403 from moodle.org and other sites that block empty User-Agents.
; Required by moosh plugin-list which fetches
; https://download.moodle.org/api/1.3/pluglist.php
user_agent = "Moosh/1.27 (Moodle)"

; Configure opcode caching: 
; PHP bytecode generated by the PHP engine is stored in shared memory, 
; which can be used across multiple PHP requests. 
; This can help to improve the performance of PHP applications by 
; reducing the amount of time required to compile and execute the PHP code
; on each request.
#
; See https://www.php.net/manual/en/opcache.configuration.php
; opcache.memory_consumption = 128M
; opcache.max_accelerated_files = 10000
; opcache.preload =
; opcache.validate_timestamps = 1
; opcache.revalidate_freq = 2