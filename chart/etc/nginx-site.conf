server {
    listen 80;
    server_name localhost;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /var/www/html/public;
    
    index index.php index.html;

    location = /my/ {
        rewrite ^ /my/index.php last;
    }
    
    location / {
        try_files $uri $uri/ /r.php$is_args$args;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info  ^(.+\.php)(/.*)$;
        fastcgi_index            index.php;
        # Use variable + resolver so nginx re-resolves the phpfpm pod IP
        # on each request (pods get new IPs on restart; static fastcgi_pass
        # caches the old IP and causes 502 Connection Refused).
        # Must use FQDN — nginx resolver does not honor resolv.conf search domains.
        # PHPFPM_NAMESPACE is replaced by Helm with .Release.Namespace at deploy time.
        resolver 10.152.183.10 valid=5s;
        set $phpfpm_upstream "phpfpm.PHPFPM_NAMESPACE.svc.cluster.local:9000";
        fastcgi_pass             $phpfpm_upstream;
        
        include                  fastcgi_params;
        fastcgi_param   PATH_INFO       $fastcgi_path_info;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    error_page 404 /error/index.php;
    error_page 403 =404 /error/index.php;

    location /dataroot/ {
        # internal;
        alias /var/www/moodledata/; # ends with /
    }

    location /cachedir/ {
        internal;
        alias /var/www/moodledata/cache/; # ends with /
    }

    location /localcachedir/ {
        internal;
        alias /var/www/moodledata/localdircache/; # ends with /
    }

    location /tempdir/ {
        internal;
        alias /var/www/moodledata/temp/; # ends with /
    }

    location /filedir/ {
        internal;
        alias /var/www/moodledata/filedir/; # ends with /
    }

    # Hide all dot files but allow "Well-Known URIs" as per RFC 5785
    location ~ /\.(?!well-known).* {
        return 404;
    }
    
    # This should be after the php fpm rule and very close to the last nginx ruleset.
    # Don't allow direct access to various internal files. See MDL-69333
    location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml) {
        deny all;
        return 404;
    }

}