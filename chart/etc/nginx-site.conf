log_format trace_headers '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status '
                         '| X-FF: "$http_x_forwarded_for" '
                         '| Real-IP: "$http_x_real_ip" '
                         '| Remote-Addr: "$remote_addr" '
                         '| Proto: "$http_x_forwarded_proto" '
                         '| Host: "$http_host"';


server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    
    access_log /var/log/nginx/access.log trace_headers;
    
    # new add
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from  144.214.120.147;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /var/www/html/public;
    
    # test add
    add_header X-Check-Forwarded-For "Value: $http_x_forwarded_for" always;
    add_header X-Check-Real-IP "Value: $http_x_real_ip" always;
    add_header X-Check-Remote-Addr "Value: $remote_addr" always;

    
    index index.php index.html;

    location = /my/ {
        rewrite ^ /my/index.php last;
    }
    
    location / {
        try_files $uri $uri/ /index.php?$query_string =404;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info  ^(.+\.php)(/.+)$;
        fastcgi_index            index.php;
        fastcgi_pass             phpfpm:9000; 
        
        include                  fastcgi_params;
        fastcgi_param   PATH_INFO       $fastcgi_path_info;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    error_page 404 /error/index.php;
    error_page 403 =404 /error/index.php;

    location /dataroot/ {
        # internal;
        alias /var/www/moodledata/; # ends with /
    }

    location /cachedir/ {
        internal;
        alias /var/www/moodledata/cache/; # ends with /
    }

    location /localcachedir/ {
        internal;
        alias /var/www/moodledata/localdircache/; # ends with /
    }

    location /tempdir/ {
        internal;
        alias /var/www/moodledata/temp/; # ends with /
    }

    location /filedir/ {
        internal;
        alias /var/www/moodledata/filedir/; # ends with /
    }

    # Hide all dot files but allow "Well-Known URIs" as per RFC 5785
    location ~ /\.(?!well-known).* {
        return 404;
    }
    
    # This should be after the php fpm rule and very close to the last nginx ruleset.
    # Don't allow direct access to various internal files. See MDL-69333
    location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml) {
        deny all;
        return 404;
    }

}
